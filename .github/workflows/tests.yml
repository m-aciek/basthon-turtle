name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  core:
    name: Core / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      COVERAGE_FILE: .coverage.core-${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package and test tools
        run: python -m pip install . 'coverage>=7.6,<8' uv
      - name: Core and headless rendering tests
        run: python -m coverage run -m unittest discover -s tests/core -v
      - name: Headless navigation and compatibility report tests
        run: python -m coverage run --append -m unittest discover -s tests/compatibility -v
      - name: Report coverage
        if: always()
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-core-${{ matrix.python }}
          path: .coverage.core-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  environments:
    name: ${{ matrix.name }} / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Notebook / AnyWidget
            suite: notebook
            extra: notebook
          - name: Standalone / WebSocket
            suite: standalone
            extra: standalone
          - name: Sidecar
            suite: sidecar
            extra: sidecar
    env:
      COVERAGE_FILE: .coverage.${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install environment and coverage
        run: python -m pip install '.[${{ matrix.extra }}]' 'coverage>=7.6,<8'
      - name: Environment unit tests
        if: matrix.suite != 'sidecar'
        run: python -m coverage run -m unittest discover -s tests -p 'test_${{ matrix.suite }}.py' -v
      - name: Real dependency integration tests
        run: python -m coverage run --append -m unittest discover -s tests/integration -p 'test_${{ matrix.suite }}.py' -v
      - name: Report coverage
        if: always()
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.suite }}
          path: .coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error

  pyodide:
    name: Pyodide / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_FILE: .coverage.pyodide
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          python -m pip install . 'coverage>=7.6,<8' playwright
          python -m playwright install --with-deps chromium
      - name: Python transport and Node.js worker regression tests
        run: python -m coverage run -m unittest discover -s tests -p test_pyodide.py -v
      - name: Pyodide drawing and callbacks in Chromium
        run: python -m unittest discover -s tests/integration -p test_browser.py -v
      - name: Report host Python coverage
        if: always()
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-pyodide
          path: .coverage.pyodide
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyodide-browser-results
          path: browser-results/

  coverage:
    name: Coverage summary
    needs: [core, environments, pyodide]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'coverage>=7.6,<8'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage data
        run: python -m coverage combine
      - name: Write informational summary
        env:
          CORE_RESULT: ${{ needs.core.result }}
          ENVIRONMENTS_RESULT: ${{ needs.environments.result }}
          PYODIDE_RESULT: ${{ needs.pyodide.result }}
        run: |
          echo '## Python coverage (informational)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Combined host Python coverage; browser-executed Python and JavaScript are not measured. No minimum coverage threshold.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CORE_RESULT" != success ] || [ "$ENVIRONMENTS_RESULT" != success ] || [ "$PYODIDE_RESULT" != success ]; then
            echo 'Some test jobs did not succeed; this report may be incomplete. Check the individual jobs.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html
          python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: error
