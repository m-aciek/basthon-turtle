name: Release

on:
  push:
    tags: ['v*']
  # Manual runs always use TestPyPI, including runs selected on a version tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
          python-version: '3.12'
          enable-cache: false
      - name: Validate version and tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from tools.check_release import check_version

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          check_version(version, os.environ['RELEASE_TAG'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
      # The default uv build builds the wheel from the generated sdist.
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Check distribution metadata and PyPI description
        run: uvx --from 'twine>=6,<7' twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify distributions / Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Inspect and install each artifact outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: uv run --no-project python tools/check_release.py dist --version "$RELEASE_VERSION"

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.1'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Publish verified artifacts using OIDC
        env:
          UV_PUBLISH_URL: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          UV_PUBLISH_CHECK_URL: ${{ github.event_name == 'push' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
        run: uv publish --trusted-publishing always dist/*

  github-release:
    if: github.event_name == 'push'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Create release or populate its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Package: https://pypi.org/project/basthon-turtle/$RELEASE_VERSION/"
          fi
